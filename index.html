<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/Stitch-DesignSystem/Logo-backfill.ico" />
    <title>Stitch Design System</title>
    <meta name="description" content="Design tokens and component reference for the Stitch tech-pack platform." />
    <!-- Same FOUC-prevention script as the main app's index.html (design/theme-control.md)
         — this site embeds the real ThemeControl (DocsLayout), so it needs the same
         before-first-paint theme application. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("stitch-theme");
          var dark = stored === "dark" ||
            ((!stored || stored === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/Stitch-DesignSystem/assets/index-4sGKgVBY.js"></script>
    <link rel="stylesheet" crossorigin href="/Stitch-DesignSystem/assets/index-Cjx3AQcu.css">
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
